<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flagrants — Heraldic dignity for those who never deserved it</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0804;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(212, 160, 48, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 10% 80%, rgba(120, 30, 20, 0.15) 0%, transparent 50%);
      color: #e8d5a3;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 2.5rem 1.5rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid rgba(212, 160, 48, 0.25);
      background: rgba(13, 8, 4, 0.85);
      backdrop-filter: blur(12px);
    }

    .header-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 0.6rem;
    }

    .header-logo svg {
      width: 100%;
      max-width: 260px;
      height: auto;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,0.7));
      transition: transform 0.3s ease;
    }
    .header-logo svg:hover {
      transform: scale(1.02);
    }

    header h1 {
      font-family: 'Cinzel Decorative', 'Cinzel', serif;
      font-size: 3rem;
      color: #FFD700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
    }

    header p.tagline {
      font-family: 'EB Garamond', serif;
      font-size: 1.15rem;
      color: #c8a060;
      font-style: italic;
      margin-top: 0.4rem;
      letter-spacing: 0.05em;
    }

    main {
      width: 100%;
      max-width: 900px;
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    .input-panel {
      background: rgba(26, 16, 8, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 160, 48, 0.35);
      border-radius: 8px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
    }

    .input-panel h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      color: #FFD700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .field-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
      min-width: 220px;
    }

    label {
      font-size: 0.85rem;
      color: #c8a060;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-weight: 600;
    }

    input[type="text"] {
      background: #140b04;
      border: 1px solid rgba(212, 160, 48, 0.4);
      color: #FFD700;
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      padding: 0.85rem 1.1rem;
      border-radius: 6px;
      outline: none;
      transition: all 0.25s ease;
    }

    input[type="text"]:focus {
      border-color: #FFD700;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.25);
    }

    .lens-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 0.7rem;
    }

    .lens-btn {
      background: #190e05;
      border: 1px solid rgba(212, 160, 48, 0.3);
      color: #c8a060;
      font-family: 'Outfit', sans-serif;
      font-size: 0.88rem;
      padding: 0.75rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      line-height: 1.3;
      font-weight: 500;
    }

    .lens-btn:hover {
      background: #2b1809;
      border-color: #FFD700;
      color: #FFD700;
      transform: translateY(-2px);
    }

    .lens-btn.selected {
      background: linear-gradient(135deg, #3d2508 0%, #663d00 100%);
      border-color: #FFD700;
      color: #FFD700;
      font-weight: 700;
      box-shadow: 0 0 14px rgba(255, 215, 0, 0.3);
    }

    .generate-btn {
      background: linear-gradient(135deg, #8a4e00 0%, #c47800 100%);
      border: 1px solid #FFD700;
      color: #ffffff;
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 1rem 2rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(138, 78, 0, 0.4);
    }

    .generate-btn:hover {
      background: linear-gradient(135deg, #a65e00 0%, #e08b00 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
    }

    .generate-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .loading {
      text-align: center;
      padding: 2.5rem;
      color: #FFD700;
      font-family: 'EB Garamond', serif;
      font-style: italic;
      font-size: 1.25rem;
      background: rgba(26, 16, 8, 0.85);
      border: 1px solid rgba(212, 160, 48, 0.3);
      border-radius: 8px;
    }

    .error {
      background: #3a0808;
      border: 1px solid #8a0000;
      color: #ff8080;
      padding: 1.2rem;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .output-panel {
      display: none;
      flex-direction: column;
      gap: 2rem;
      background: rgba(26, 16, 8, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 160, 48, 0.4);
      border-radius: 8px;
      padding: 2.2rem;
      box-shadow: 0 16px 48px rgba(0,0,0,0.7);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .output-panel.visible { display: flex; }

    .output-header {
      width: 100%;
      text-align: center;
      padding-bottom: 1.4rem;
      border-bottom: 1px solid rgba(212, 160, 48, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

    .main-heading {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      color: #FFD700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: bold;
      line-height: 1.25;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .subject-name {
      color: #FFD700;
    }

    .subject-affectation {
      font-size: 1.45rem;
      color: #c8a060;
      font-style: italic;
      text-transform: none;
      font-weight: normal;
      font-family: 'EB Garamond', serif;
    }

    .slogan-block {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: baseline;
      gap: 0.7rem;
      margin-top: 0.2rem;
    }

    .slogan-motto {
      font-family: 'Cinzel', serif;
      font-size: 1.45rem;
      color: #FFD700;
      font-style: italic;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .slogan-translation {
      font-family: 'EB Garamond', serif;
      font-size: 1.25rem;
      color: #c8a060;
      font-style: italic;
    }

    .twinning-block {
      font-size: 0.98rem;
      color: #c8a060;
      margin-top: 0.4rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .twinning-label {
      color: #a08040;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
    }

    .twinning-item {
      background: #261608;
      border: 1px solid rgba(212, 160, 48, 0.4);
      padding: 0.25rem 0.8rem;
      border-radius: 14px;
      color: #FFD700;
      font-size: 0.9rem;
      font-style: italic;
      font-family: 'EB Garamond', serif;
    }

    .re-design-bar {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      background: #180d04;
      border: 1px solid rgba(212, 160, 48, 0.25);
      border-radius: 6px;
      padding: 0.9rem 1.2rem;
    }

    .re-design-title {
      font-size: 0.82rem;
      color: #a08040;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .re-design-buttons {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.2rem;
    }

    .re-lens-btn {
      background: #241407;
      border: 1px solid rgba(212, 160, 48, 0.25);
      color: #c8a060;
      font-size: 0.82rem;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .re-lens-btn:hover, .re-lens-btn.active {
      border-color: #FFD700;
      color: #FFD700;
      background: #3a200a;
    }

    .crest-layout {
      display: grid;
      grid-template-columns: 270px 1fr;
      gap: 2.2rem;
      align-items: start;
    }

    @media (max-width: 680px) {
      .crest-layout { grid-template-columns: 1fr; }
    }

    .crest-figure {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      background: #170c04;
      border: 1px solid rgba(212, 160, 48, 0.25);
      border-radius: 8px;
      padding: 1.5rem 1rem;
    }

    .crest-figure svg {
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.8));
      max-width: 100%;
      height: auto;
    }

    .lens-label {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      color: #FFD700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border: 1px solid rgba(255, 215, 0, 0.4);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      background: rgba(255, 215, 0, 0.08);
    }

    .commentary-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .section-subheading {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      color: #FFD700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-bottom: 1px solid rgba(212, 160, 48, 0.3);
      padding-bottom: 0.5rem;
    }

    .commentary {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .commentary-block {
      background: #1a0e05;
      border-left: 3px solid #FFD700;
      padding: 1rem 1.2rem;
      border-radius: 0 6px 6px 0;
    }

    .commentary-element {
      font-family: 'Cinzel', serif;
      font-size: 0.92rem;
      color: #FFD700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.35rem;
    }

    .commentary-text {
      font-family: 'EB Garamond', serif;
      font-size: 1.1rem;
      line-height: 1.55;
      color: #e8d5a3;
    }

    .excuse-block {
      background: #241106;
      border: 1px solid rgba(206, 17, 38, 0.4);
      border-left: 4px solid #CE1126;
      padding: 1.2rem 1.5rem;
      border-radius: 0 6px 6px 0;
      font-family: 'EB Garamond', serif;
      font-style: italic;
      font-size: 1.15rem;
      color: #f8c8c8;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<header>
  <div class="header-logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ground -->
  <rect x="0" y="120" width="320" height="40" fill="#2a1a00"/>
  <line x1="0" y1="120" x2="320" y2="120" stroke="#5a3d10" stroke-width="1.5"/>

  <!-- ── CHICKEN (right side, facing left, breathing fire) ── -->
  <!-- Body -->
  <ellipse cx="250" cy="98" rx="32" ry="24" fill="#c8a030" stroke="#7a5c10" stroke-width="1.5"/>
  <!-- Neck -->
  <ellipse cx="224" cy="78" rx="12" ry="16" fill="#c8a030" stroke="#7a5c10" stroke-width="1.5"/>
  <!-- Head -->
  <circle cx="214" cy="64" r="14" fill="#c8a030" stroke="#7a5c10" stroke-width="1.5"/>
  <!-- Comb -->
  <path d="M 208,53 Q 210,45 213,50 Q 215,42 218,48 Q 221,40 222,48" fill="#CE1126" stroke="none"/>
  <!-- Beak (open, facing left) -->
  <path d="M 202,64 L 196,61 L 196,67 Z" fill="#e8a030"/>
  <path d="M 202,64 L 196,67 L 200,70 Z" fill="#c07020"/>
  <!-- Eye -->
  <circle cx="210" cy="61" r="3" fill="#1a1008"/>
  <circle cx="209" cy="60" r="1" fill="#fff"/>
  <!-- Wattle -->
  <ellipse cx="205" cy="70" rx="4" ry="5" fill="#CE1126"/>
  <!-- Wing -->
  <path d="M 235,88 Q 248,70 265,80 Q 255,90 240,105 Z" fill="#b89020" stroke="#7a5c10" stroke-width="1"/>
  <!-- Tail feathers -->
  <path d="M 280,90 Q 300,70 305,85 Q 295,92 282,98" fill="#c8a030" stroke="#7a5c10" stroke-width="1"/>
  <path d="M 278,96 Q 302,82 307,98 Q 295,100 280,102" fill="#d4b040" stroke="#7a5c10" stroke-width="1"/>
  <!-- Legs -->
  <line x1="242" y1="120" x2="238" y2="135" stroke="#b09030" stroke-width="3"/>
  <line x1="258" y1="120" x2="262" y2="135" stroke="#b09030" stroke-width="3"/>
  <!-- Feet -->
  <path d="M 238,135 L 228,138 M 238,135 L 235,142 M 238,135 L 242,140" stroke="#b09030" stroke-width="2"/>
  <path d="M 262,135 L 252,138 M 262,135 L 259,142 M 262,135 L 266,140" stroke="#b09030" stroke-width="2"/>

  <!-- ── FIRE from chicken beak ── -->
  <g filter="url(#glow)">
    <path d="M 196,64 Q 175,50 155,65 Q 165,55 150,75 Q 160,60 145,80 Q 158,68 148,88 Q 162,72 155,90 Q 165,75 162,95 Q 175,78 170,98 Q 182,80 178,100 Q 188,85 185,105 Q 190,70 196,64 Z" fill="#FF6600" opacity="0.9"/>
    <path d="M 196,64 Q 178,56 162,68 Q 170,59 158,76 Q 167,63 156,82 Q 168,69 163,88 Q 174,75 170,93 Q 180,78 178,98 Q 187,82 185,104 Q 191,72 196,64 Z" fill="#FF9900" opacity="0.85"/>
    <path d="M 196,64 Q 182,60 170,70 Q 176,63 166,78 Q 174,66 166,84 Q 176,72 172,90 Q 181,77 179,96 Q 187,80 185,103 Q 191,75 196,64 Z" fill="#FFCC00" opacity="0.8"/>
    <path d="M 196,64 Q 186,63 178,72 Q 182,66 174,80 Q 182,70 176,88 Q 184,76 182,94 Q 188,80 186,102 Q 192,78 196,64 Z" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- ── ST. GEORGE (left side, running right, in full armour) ── -->
  <line x1="48" y1="115" x2="30" y2="117" stroke="#3d2b0a" stroke-width="1" opacity="0.5"/>
  <line x1="52" y1="110" x2="33" y2="109" stroke="#3d2b0a" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="105" x2="32" y2="102" stroke="#3d2b0a" stroke-width="1" opacity="0.3"/>

  <line x1="76" y1="112" x2="55" y2="130" stroke="#5a6a7a" stroke-width="6" stroke-linecap="round"/>
  <line x1="55" y1="130" x2="42" y2="122" stroke="#5a6a7a" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="42" cy="123" rx="10" ry="5" fill="#2a1a08" transform="rotate(-20,42,123)"/>

  <rect x="62" y="72" width="32" height="40" rx="5" fill="#8a9aaa" stroke="#5a6a7a" stroke-width="2"/>
  <line x1="78" y1="75" x2="78" y2="108" stroke="#6a7a8a" stroke-width="1"/>
  <ellipse cx="78" cy="78" rx="6" ry="4" fill="none" stroke="#6a7a8a" stroke-width="1"/>

  <rect x="75" y="80" width="6" height="18" fill="#CE1126" opacity="0.85"/>
  <rect x="68" y="85" width="20" height="6" fill="#CE1126" opacity="0.85"/>

  <line x1="78" y1="112" x2="100" y2="128" stroke="#5a6a7a" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="128" x2="110" y2="118" stroke="#5a6a7a" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="111" cy="119" rx="10" ry="5" fill="#2a1a08" transform="rotate(15,111,119)"/>

  <g transform="translate(58,78) rotate(20)">
    <path d="M 0,0 L 22,0 L 22,28 Q 11,38 0,28 Z" fill="#CE1126" stroke="#8a1a08" stroke-width="2"/>
    <rect x="8" y="3" width="4" height="20" fill="#FFD700"/>
    <rect x="2" y="10" width="18" height="4" fill="#FFD700"/>
  </g>

  <line x1="90" y1="78" x2="118" y2="88" stroke="#5a6a7a" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="119" cy="89" rx="7" ry="5" fill="#6a7a8a" stroke="#4a5a6a" stroke-width="1.5"/>
  <line x1="119" y1="87" x2="138" y2="103" stroke="#c0c8d0" stroke-width="3" stroke-linecap="round"/>
  <line x1="115" y1="91" x2="123" y2="83" stroke="#c0c8d0" stroke-width="2"/>
  <circle cx="115" cy="92" r="3" fill="#8a9aaa"/>

  <rect x="73" y="60" width="12" height="14" rx="3" fill="#8a9aaa" stroke="#5a6a7a" stroke-width="1.5"/>

  <ellipse cx="79" cy="58" rx="16" ry="14" fill="#7a8a9a" stroke="#5a6a7a" stroke-width="2"/>
  <line x1="68" y1="56" x2="90" y2="56" stroke="#3a4a5a" stroke-width="2"/>
  <line x1="70" y1="60" x2="88" y2="60" stroke="#3a4a5a" stroke-width="1.5"/>
  <path d="M 79,45 Q 72,32 68,38 Q 65,28 70,34 Q 67,22 74,30" fill="#CE1126" stroke="none"/>
  <rect x="77" y="48" width="4" height="12" fill="#5a6a7a"/>

  <ellipse cx="65" cy="75" rx="10" ry="6" fill="#7a8a9a" stroke="#5a6a7a" stroke-width="1.5"/>
  <ellipse cx="93" cy="75" rx="10" ry="6" fill="#7a8a9a" stroke="#5a6a7a" stroke-width="1.5"/>
</svg>

  </div>
  <h1>Flagrants</h1>
  <p class="tagline">Heraldic dignity for those who never deserved it</p>
</header>

<main>

  <div class="input-panel">
    <h2>Mode I — Location Flag</h2>

    <div class="field-row">
      <div class="field-group">
        <label for="location">Location, postcode, or place</label>
        <input type="text" id="location" placeholder="e.g. Slough, SW1A 1AA, Runnymede…" autocomplete="off"/>
      </div>
    </div>

    <div class="field-group">
      <label>Defence Lens</label>
      <div class="lens-grid" id="lens-grid">
        <!-- Populated by JS -->
      </div>
    </div>

    <button class="generate-btn" id="generate-btn" disabled>Generate Crest</button>
  </div>

  <div class="loading" id="loading" style="display:none">
    The Herald is researching. This may take a moment. He is thorough.
  </div>

  <div class="error" id="error" style="display:none"></div>

  <div class="output-panel" id="output-panel">
    <div class="output-header">
      <h2 class="main-heading">
        <span class="subject-name" id="subject-name"></span>
        <span class="subject-affectation" id="subject-affectation"></span>
      </h2>
      <div class="slogan-block" id="slogan-block">
        <span class="slogan-motto" id="slogan-motto"></span>
        <span class="slogan-translation" id="slogan-translation"></span>
      </div>
      <div class="twinning-block" id="twinning-block"></div>
    </div>

    <!-- Fast Lens Switcher bar inside output panel -->
    <div class="re-design-bar">
      <div class="re-design-title">⚡ Try another Defence Lens instantly:</div>
      <div class="re-design-buttons" id="re-design-buttons"></div>
    </div>

    <div class="crest-layout">
      <div class="crest-figure">
        <div id="crest-svg"></div>
        <div class="lens-label" id="lens-label"></div>
      </div>
      <div class="commentary-container">
        <h3 class="section-subheading">Segment Pictures & Stories</h3>
        <div class="commentary" id="commentary"></div>
      </div>
    </div>
    <div class="excuse-block" id="excuse-block"></div>
  </div>

</main>

<script>
  const LENSES = [
    { id: 'proud_of_it',        label: 'Proud of It',          desc: 'This was fine. The herald sees no issue whatsoever.' },
    { id: 'full_cover_up',      label: 'Full Cover-Up',        desc: 'It never happened. The herald is confused by the question.' },
    { id: 'admit_faults',       label: 'Admit Faults',         desc: 'Yes, there were some irregularities. The crest acknowledges this minimally.' },
    { id: 'blame_others',       label: 'Blame Others',         desc: 'External forces. Enemies. God\'s specific instruction at the time.' },
    { id: 'deeply_sorry',       label: 'Deeply Sorry',         desc: 'Full modern apology. All the correct language. Nothing has changed.' },
    { id: 'context_everything', label: 'Context Is Everything',desc: 'You have to understand the times. The herald provides context. It does not help.' },
    { id: 'revisionist',        label: 'Revisionist',          desc: 'Actually they were the heroes. New research supports this.' }
  ];

  let selectedLens = null;
  let currentFindings = null;
  let currentLocation = null;

  const locationInput = document.getElementById('location');
  const generateBtn   = document.getElementById('generate-btn');
  const lensGrid      = document.getElementById('lens-grid');
  const reDesignContainer = document.getElementById('re-design-buttons');

  LENSES.forEach(lens => {
    const btn = document.createElement('button');
    btn.className = 'lens-btn';
    btn.textContent = lens.label;
    btn.title = lens.desc;
    btn.dataset.lens = lens.id;
    btn.addEventListener('click', () => {
      lensGrid.querySelectorAll('.lens-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedLens = lens.id;
      checkReady();
    });
    lensGrid.appendChild(btn);
  });

  locationInput.addEventListener('input', checkReady);

  function checkReady() {
    generateBtn.disabled = !(locationInput.value.trim() && selectedLens);
  }

  generateBtn.addEventListener('click', generate);

  async function generate() {
    const location = locationInput.value.trim();
    if (!location || !selectedLens) return;

    currentLocation = location;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('output-panel').classList.remove('visible');
    document.getElementById('error').style.display = 'none';
    generateBtn.disabled = true;

    try {
      const WORKER = window.location.origin.includes('workers.dev') ? window.location.origin : 'https://flagrants-api.leanspirited.workers.dev';
      
      const researchRes = await fetch(`${WORKER}/research`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'location', subject: location })
      });
      if (!researchRes.ok) throw new Error(`Research failed: ${researchRes.status}`);
      currentFindings = await researchRes.json();

      await reDesignWithLens(selectedLens);
    } catch (err) {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = `The Herald encountered a difficulty: ${err.message}`;
    } finally {
      document.getElementById('loading').style.display = 'none';
      generateBtn.disabled = false;
      checkReady();
    }
  }

  async function reDesignWithLens(lensId) {
    if (!currentFindings) return;
    selectedLens = lensId;

    try {
      const WORKER = window.location.origin.includes('workers.dev') ? window.location.origin : 'https://flagrants-api.leanspirited.workers.dev';
      const designRes = await fetch(`${WORKER}/design`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ findings: currentFindings, lens: lensId })
      });
      if (!designRes.ok) throw new Error(`Design failed: ${designRes.status}`);
      const result = await designRes.json();

      renderOutput(currentLocation, result);
    } catch (err) {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = `Re-design failed: ${err.message}`;
    }
  }

  function renderOutput(location, result) {
    document.getElementById('crest-svg').innerHTML = result.svg;
    
    document.getElementById('subject-name').textContent = location;
    const affectation = result.affectation ?? result.nickname ?? '';
    document.getElementById('subject-affectation').textContent = affectation ? ` — ${affectation}` : '';

    const motto = result.motto ?? '';
    const translation = result.motto_translation ?? '';
    document.getElementById('slogan-motto').textContent = motto ? `“${motto}”` : '';
    document.getElementById('slogan-translation').textContent = translation ? `(${translation})` : '';

    // Render Twinned Places
    const twinningContainer = document.getElementById('twinning-block');
    twinningContainer.innerHTML = '';
    const twinned = result.twinned_with ?? result.twinned ?? [];
    if (Array.isArray(twinned) && twinned.length > 0) {
      const label = document.createElement('span');
      label.className = 'twinning-label';
      label.textContent = '🤝 Twinned with:';
      twinningContainer.appendChild(label);
      
      twinned.forEach(place => {
        const item = document.createElement('span');
        item.className = 'twinning-item';
        item.textContent = place;
        twinningContainer.appendChild(item);
      });
    }

    // Fast Lens Switcher Buttons
    reDesignContainer.innerHTML = '';
    LENSES.forEach(l => {
      const btn = document.createElement('button');
      btn.className = `re-lens-btn ${l.id === result.lens ? 'active' : ''}`;
      btn.textContent = l.label;
      btn.addEventListener('click', () => reDesignWithLens(l.id));
      reDesignContainer.appendChild(btn);
    });

    document.getElementById('lens-label').textContent =
      LENSES.find(l => l.id === result.lens)?.label ?? result.lens;

    const commentary = document.getElementById('commentary');
    commentary.innerHTML = '';
    (result.commentary ?? []).forEach(block => {
      const div = document.createElement('div');
      div.className = 'commentary-block';
      div.innerHTML = `
        <div class="commentary-element">${escapeHtml(block.element)}</div>
        <div class="commentary-text">${escapeHtml(block.text)}</div>`;
      commentary.appendChild(div);
    });

    document.getElementById('excuse-block').textContent = result.excuse ?? '';
    document.getElementById('output-panel').classList.add('visible');
    document.getElementById('output-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
</script>

</body>
</html>
